<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="value-journey">
        <h3>🚀 Your Skillexa Journey</h3>
        <ul>
            <li>✅ Earn points by completing real-world projects</li>
            <li>💼 Gain job-ready experience, not just theory</li>
            <li>🌍 Join a community of builders, thinkers, doers</li>
        </ul>
        <p class="cta">Start your journey. Build your future. 💡</p>
    </div>
    
    <form id="loginForm">
        <h2>Login</h2>
        <button type="button" onclick="window.location.href='/api/auth/google'" style="width:100%;margin-top:12px;background:#fff;color:#444;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;gap:8px;">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="height:20px;vertical-align:middle;">
            Sign in with Google
        </button>
        <input type="text" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="submit" value="Login">
        <div class="forgot-password">
            <a href="/register.html">Forgot Password?</a>
        </div>
    </form>
    <script src="/assets/login.js"></script>
</body>
</html>
